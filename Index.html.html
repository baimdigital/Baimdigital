<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servis Sosial Media</title>
<style>
:root{--bg:#050505;--card:#121212;--line:#2b2412;--tx:#f6f1e3;--mu:#a39b86;--bl:#d4af37;--gn:#d4af37;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#0c0a05;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:19px;margin:0}main{padding:14px 16px 40px;max-width:560px;margin:auto}
.nav button{background:none;border:0;color:var(--mu);font-size:14px;padding:6px 10px;border-radius:10px}.nav .on{background:var(--bl);color:#111;font-weight:600}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;background:none;border:1px solid var(--line);color:var(--tx);padding:8px 16px;border-radius:99px;font-size:14px}.chip.on{background:var(--bl);border-color:var(--bl);color:#111;font-weight:600}
.ib{display:inline-flex;width:22px;height:22px;border-radius:7px;background:#000;align-items:center;justify-content:center;margin-right:8px;vertical-align:-6px;padding:3px;border:1px solid #2b2412}.ib svg{width:100%;height:100%}.lgb{width:42px;height:42px;margin:0;flex:none;border-radius:12px;padding:7px;vertical-align:0}.note{color:var(--mu);font-size:13px;margin:4px 0 12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.item b{display:block;font-size:14px}.pr{color:var(--bl);font-weight:700;margin-top:3px}.pr small{color:var(--mu);font-weight:400}
.btn{background:var(--bl);color:#111;border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:15px}.btn.g{background:var(--gn);width:100%;margin-top:10px;padding:14px}
.btn.o{background:none;border:1px solid var(--line);width:100%;margin-top:8px;padding:13px}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.ov.on{display:flex}
.sh{background:#0c0a05;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:auto;max-height:92%;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-top:16px}
.qr{width:220px;height:220px;margin:12px auto;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#333;text-align:center;font-size:13px;padding:10px;overflow:hidden}.qr img{width:100%;height:100%;object-fit:contain}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px}.ord .m{color:var(--mu);font-size:12px;word-break:break-all}
.tag{float:right;background:#2b2412;color:#d4af37;border-radius:8px;padding:2px 8px;font-size:12px}
.err{color:#f87171;font-size:13px;margin-top:8px;min-height:16px}
</style></head><body>

function chips(el,arr,sel,fn,ic){el.innerHTML="";arr.forEach(a=>{const b=document.createElement("button");b.className="chip"+(a==sel?" on":"");b.innerHTML=(ic?`<span class="ib">${ic[a]}</span>`:"")+a;b.onclick=()=>fn(a);el.appendChild(b)})}
function draw(){
chips($("pl"),Object.keys(D),pf,a=>{pf=a;cat=Object.keys(D[a])[0];draw()},IC);
chips($("ct"),Object.keys(D[pf]),cat,a=>{cat=a;draw()});
$("ds").textContent=DS[cat]||"";
$("ls").innerHTML=D[pf][cat].map((x,i)=>`<div class="item"><span class="ib lgb">${IC[pf]}</span><div style="flex:1"><b>${E(x[0])}</b><div class="pr">${F(P(x[1]))} <small>/ pakej</small></div></div><button class="btn" data-i="${i}">Beli</button></div>`).join("");
$("ls").querySelectorAll("button").forEach(b=>b.onclick=()=>openForm(D[pf][cat][+b.dataset.i]))}
function show(h){$("sh").innerHTML=h;$("ov").classList.add("on")}
function hide(){$("ov").classList.remove("on")}
$("ov").onclick=e=>{if(e.target.id=="ov")hide()};
function openForm(x){cur={n:x[0],p:P(x[1]),pf:pf};
show(`<h2 style="margin:0 0 4px;font-size:17px">${E(x[0])}</h2><div class="pr">${F(cur.p)} <small>/ pakej</small></div>
<label>Nama</label><input id="f1" autocomplete="name">
<label>No. telefon</label><input id="f2" type="tel" placeholder="01x-xxxxxxx">
<label>Link akaun / post (pastikan akaun PUBLIC)</label><input id="f3" placeholder="https://...">
<label>Kuantiti (bilangan pakej)</label><input id="f4" type="number" min="1" value="1">
<label>Nota (pilihan)</label><textarea id="f5" rows="2"></textarea>
<div class="tot"><span>Jumlah</span><span id="tt">${F(cur.p)}</span></div><div class="err" id="er"></div>
<button class="btn g" id="sb" style="background:var(--bl)">Hantar Pesanan</button><button class="btn o" id="cl">Batal</button>`);
$("f4").oninput=()=>{const q=Math.max(1,parseInt($("f4").value)||1);$("tt").textContent=F(cur.p*q)};
$("cl").onclick=hide;$("sb").onclick=submit}
function submit(){
const o={id:"ORD"+Date.now().toString(36).toUpperCase(),name:$("f1").value.trim(),phone:$("f2").value.trim(),link:$("f3").value.trim(),qty:Math.max(1,parseInt($("f4").value)||1),note:$("f5").value.trim(),prod:cur.n,plat:cur.pf,price:cur.p,ts:Date.now(),status:"Menunggu bayaran"};
if(!o.name||o.phone.replace(/\D/g,"").length<9||!/^https?:\/\/|^@/i.test(o.link)){$("er").textContent="Sila isi nama, no. telefon yang sah dan link akaun (https://… atau @username).";return}
o.total=o.price*o.qty;
const msg=`*PESANAN BARU ${o.id}*\nProduk: ${o.prod} (${o.plat})\nKuantiti: ${o.qty}\nJumlah: ${F(o.total)}\nNama: ${o.name}\nTel: ${o.phone}\nLink: ${o.link}\nNota: ${o.note||"-"}`;
const url="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
mine.unshift(o);try{localStorage.setItem("ord",JSON.stringify(mine.slice(0,50)))}catch(e){}
try{window.open(url,"_blank")}catch(e){}
show(`<h2 style="margin:0;font-size:17px">Pesanan diterima ✅</h2><div class="note">ID: ${o.id}</div>
<div class="tot"><span>Sila bayar</span><span>${F(o.total)}</span></div>
<div class="qr">${QR?`<img src="${QR}" alt="QR bayaran">`:"QR pembayaran akan diletak di sini"}</div>
<div class="note" style="text-align:center">Scan QR, bayar, kemudian hantar bukti bayaran di WhatsApp.</div>
<a href="${url}" target="_blank" rel="noopener" style="text-decoration:none"><button class="btn g">Hantar pesanan ke WhatsApp</button></a><button class="btn o" id="cl">Tutup</button>`);
$("cl").onclick=()=>{hide();view(2)};renderOrders()}
function renderOrders(){
const seen=new Set(all.map(o=>o.id)),list=all.concat(mine.filter(o=>!seen.has(o.id))).sort((a,b)=>b.ts-a.ts);
$("on").textContent="Pesanan anda di peranti ini";
$("ol").innerHTML=list.length?list.map(o=>`<div class="ord"><span class="tag">${E(o.status)}</span><b>${E(o.id)}</b><div>${E(o.prod)} × ${o.qty} — <b>${F(o.total)}</b></div><div>${E(o.name)} · ${E(o.phone)}</div><div class="m">${E(o.link)}${o.note?" · "+E(o.note):""}</div><div class="m">${new Date(o.ts).toLocaleString("ms-MY")}</div></div>`).join(""):'<div class="note">Belum ada pesanan.</div>'}
function view(n){$("v1").style.display=n==1?"":"none";$("v2").style.display=n==2?"":"none";$("n1").className=n==1?"on":"";$("n2").className=n==2?"on":"";if(n==2)renderOrders()}
$("n1").onclick=()=>view(1);$("n2").onclick=()=>view(2);
draw();
</script></body></html>
